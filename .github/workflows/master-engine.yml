name: Master research engine
on:
  workflow_dispatch:
    inputs:
      job:
        description: Bounded engine job
        required: true
        type: choice
        options: [universe, calendar, prices, score, queue, sectors, listings, context, grade, market_scan, fundamentals, doctor]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 10,11 * * 1-5'
    - cron: '15 10,11,22,23 * * 1-5'
    - cron: '30 21,22 * * 1-5'
    - cron: '0 0,1 * * 2-6'
permissions:
  contents: read
concurrency:
  group: master-research-engine
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Run at the matching Eastern time
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://fepyjsmmgortycprrxjr.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINN_HUB }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SEC_USER_AGENT: 'EarningsRadar mace@udel.edu'
          MANUAL_JOB: ${{ inputs.job }}
        run: python -m engine.schedule
