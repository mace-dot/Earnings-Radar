name: Collect public research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: research-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.RADAR_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: EarningsRadar mace@udel.edu
      RADAR_MODEL_ENABLED: 'false'
      RADAR_TELEGRAM_ENABLED: 'false'
    steps:
      - name: Check database configuration
        run: |
          test -n "$SUPABASE_URL" || { echo 'Set SUPABASE_URL in repository Actions secrets'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Set SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect and analyze official sources
        run: python -m earnings_radar.worker --once --db /tmp/radar-cloud.db
      - name: Save public research to Supabase
        run: python -m earnings_radar.cloud_sync --db /tmp/radar-cloud.db
